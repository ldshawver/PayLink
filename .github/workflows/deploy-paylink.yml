name: Deploy PayLink to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-paylink-production
  cancel-in-progress: true

jobs:
  deploy_app:
    name: Deploy Private App (app.mypaylink.app)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app deploy secrets
        run: |
          [ -n "${{ secrets.APP_VPS_HOST }}" ] || { echo "Missing APP_VPS_HOST"; exit 1; }
          [ -n "${{ secrets.APP_VPS_USER }}" ] || { echo "Missing APP_VPS_USER"; exit 1; }
          [ -n "${{ secrets.APP_VPS_PORT }}" ] || { echo "Missing APP_VPS_PORT"; exit 1; }
          [ -n "${{ secrets.APP_VPS_SSH_KEY }}" ] || { echo "Missing APP_VPS_SSH_KEY"; exit 1; }

      - name: Deploy private app over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_NAME="paylink"
            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            APP_ENTRY="$APP_DIR/dist/index.cjs"
            APP_PORT="8000"
            ENV_FILE="/etc/paylink/.env"

            echo "========== PRIVATE APP DEPLOY START =========="
            echo "User: $(whoami)"
            echo "App dir: $APP_DIR"

            cd "$APP_DIR"

            echo "==> Git sync"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Versions"
            node -v
            npm -v
            pm2 -v

            echo "==> Validate repo files"
            test -d "$APP_DIR" || { echo "ERROR: Missing repo dir: $APP_DIR"; exit 1; }
            test -f "$APP_DIR/package.json" || { echo "ERROR: Missing package.json"; exit 1; }
            test -f "$ENV_FILE" || { echo "ERROR: Missing env file: $ENV_FILE"; exit 1; }

            echo "==> Install dependencies"
            npm ci

            echo "==> Build app"
            npm run build

            echo "==> Verify build output"
            test -f "$APP_ENTRY" || { echo "ERROR: Missing build artifact: $APP_ENTRY"; exit 1; }

            echo "==> Restart PM2 app"
            pm2 delete "$APP_NAME" 2>/dev/null || true
            sleep 2

            pm2 start "$APP_ENTRY" \
              --name "$APP_NAME" \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              --restart-delay 5000 \
              --max-restarts 5 \
              -- dotenv_config_path="$ENV_FILE"

            echo "==> Save PM2 process list"
            pm2 save --force

            echo "==> Wait for startup"
            sleep 15

            echo "==> PM2 diagnostics"
            pm2 list
            pm2 describe "$APP_NAME" || true
            pm2 logs "$APP_NAME" --lines 100 --nostream || true

            echo "==> Port check"
            ss -tlnp | grep ":$APP_PORT" || true

            echo "==> Health checks"
            HEALTH_CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$APP_PORT/health || true)"
            READY_CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$APP_PORT/ready || true)"
            echo "Health: $HEALTH_CODE | Ready: $READY_CODE"

            if [ "$HEALTH_CODE" != "200" ] && [ "$READY_CODE" != "200" ]; then
              echo "ERROR: Private app failed health checks"
              pm2 logs "$APP_NAME" --lines 150 --nostream || true
              exit 1
            fi

            echo "========== PRIVATE APP DEPLOY SUCCESS =========="

  deploy_marketing:
    name: Deploy Marketing Site (mypaylink.app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: deploy_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketing deploy secrets
        run: |
          [ -n "${{ secrets.MKT_VPS_HOST }}" ] || { echo "Missing MKT_VPS_HOST"; exit 1; }
          [ -n "${{ secrets.MKT_VPS_USER }}" ] || { echo "Missing MKT_VPS_USER"; exit 1; }
          [ -n "${{ secrets.MKT_VPS_PORT }}" ] || { echo "Missing MKT_VPS_PORT"; exit 1; }
          [ -n "${{ secrets.MKT_VPS_SSH_KEY }}" ] || { echo "Missing MKT_VPS_SSH_KEY"; exit 1; }

      - name: Deploy marketing site over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MKT_VPS_HOST }}
          username: ${{ secrets.MKT_VPS_USER }}
          key: ${{ secrets.MKT_VPS_SSH_KEY }}
          port: ${{ secrets.MKT_VPS_PORT }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            # Repo already exists under the private app deploy user
            SOURCE_REPO="/home/paylinkssh/paylink-app/PayLink"

            # Adjust this if your marketing source folder name differs
            MARKETING_DIR="$SOURCE_REPO/public-site"
            MARKETING_PUBLIC="$MARKETING_DIR/public"
            MARKETING_SERVER="$MARKETING_DIR/server.js"

            # CloudPanel marketing site root
            WEB_ROOT="/home/mypaylink/htdocs/mypaylink.app"

            echo "========== MARKETING DEPLOY START =========="
            echo "User: $(whoami)"
            echo "Source repo: $SOURCE_REPO"
            echo "Web root: $WEB_ROOT"

            test -d "$SOURCE_REPO" || { echo "ERROR: Missing source repo: $SOURCE_REPO"; exit 1; }
            test -d "$MARKETING_DIR" || { echo "ERROR: Missing marketing dir: $MARKETING_DIR"; exit 1; }
            test -d "$MARKETING_PUBLIC" || { echo "ERROR: Missing marketing public dir: $MARKETING_PUBLIC"; exit 1; }
            test -d "$WEB_ROOT" || { echo "ERROR: Missing marketing web root: $WEB_ROOT"; exit 1; }

            echo "==> Sync static marketing files"
            rsync -av --delete "$MARKETING_PUBLIC/" "$WEB_ROOT/"

            echo "==> Fix file permissions"
            find "$WEB_ROOT" -type f -exec chmod 644 {} \;
            find "$WEB_ROOT" -type d -exec chmod 755 {} \;

            echo "==> Restart marketing PM2 process if server exists"
            if [ -f "$MARKETING_SERVER" ]; then
              SITE_NAME="paylink-marketing"
              pm2 describe "$SITE_NAME" >/dev/null 2>&1 \
                && pm2 restart "$SITE_NAME" --update-env \
                || pm2 start "$MARKETING_SERVER" --name "$SITE_NAME" --cwd "$MARKETING_DIR"
              pm2 save --force
              pm2 describe "$SITE_NAME" || true
              pm2 logs "$SITE_NAME" --lines 100 --nostream || true
            else
              echo "==> No marketing Node server file found; static deploy only"
            fi

            echo "========== MARKETING DEPLOY SUCCESS =========="
