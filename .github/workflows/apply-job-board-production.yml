name: Apply Production Job Board Migrations 0029-0030

# Gated, manual application of the two additive Job Board migrations to the
# production database. Sibling of apply-schema-readiness-production.yml (which
# stays pinned to v2.2.17 / 0027-0028). The migration files are read from the
# annotated release tag and must match the SHA-256 values pinned below, so a
# modified file can never be applied by this workflow.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Annotated release tag containing migrations 0029 and 0030"
        required: true
        type: string

concurrency:
  group: migrate-mypaylink-production
  cancel-in-progress: false

jobs:
  apply:
    name: Back up, apply 0029-0030, and reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        run: test "${{ inputs.release_tag }}" = "v2.2.20"

      - name: Apply additive production migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 20m
          script_stop: true
          script: |
            set -Eeuo pipefail
            APP_PATH="/home/paylinkssh/paylink-app/PayLink"
            ENV_FILE="/etc/paylink/.env"
            RELEASE_TAG="v2.2.20"
            BACKUP_DIR="/home/paylinkssh/paylink-db-backups"
            SHA_0029="d2d68c69455d0f795127223b09c3c94da2545352bf9637c400b2ca8e6ae3ad6a"
            SHA_0030="20bc1a471ee6cd464117f5ec8cf13824d5115ed21869f32bdec3cd9b46f56cbe"

            test -f "$ENV_FILE"
            cd "$APP_PATH"
            git fetch origin --tags
            test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
            echo "release tag $RELEASE_TAG -> $(git rev-parse "$RELEASE_TAG^{commit}")"

            # No existing migration may be modified, deleted or renamed since v2.2.19.
            test -z "$(git diff --diff-filter=MDRT --name-only v2.2.19 "$RELEASE_TAG" -- migrations/)"

            WORK="$(mktemp -d)"
            trap 'rm -rf "$WORK"' EXIT
            git show "$RELEASE_TAG:migrations/0029_job_board.sql" > "$WORK/0029.sql"
            git show "$RELEASE_TAG:migrations/0030_job_board_public_access.sql" > "$WORK/0030.sql"
            echo "$SHA_0029  $WORK/0029.sql" | sha256sum -c -
            echo "$SHA_0030  $WORK/0030.sql" | sha256sum -c -

            set -a
            . "$ENV_FILE"
            set +a
            test -n "${DATABASE_URL:-}"
            PSQL() { psql "$DATABASE_URL" -X -At -v ON_ERROR_STOP=1 "$@"; }

            # Preconditions: 0027/0028 recorded once each, 0029/0030 absent.
            test "$(PSQL -c "SELECT string_agg(version || 'x' || n, ',' ORDER BY version) FROM (SELECT version, count(*) n FROM paylink_migrations.applied GROUP BY version) s")" = "0027x1,0028x1"
            test -z "$(PSQL -c "SELECT to_regclass('public.job_posts')")"
            test -z "$(PSQL -c "SELECT to_regclass('public.job_board_settings')")"

            mkdir -p "$BACKUP_DIR" 2>/dev/null || true
            if [ ! -w "$BACKUP_DIR" ]; then
              BACKUP_DIR="${HOME:-/home/paylinkssh}/paylink-predeploy-backups"
              mkdir -p "$BACKUP_DIR"
            fi
            BACKUP_FILE="$BACKUP_DIR/pre-migration-0029-0030-$(date -u '+%Y%m%dT%H%M%SZ').sql"
            pg_dump "$DATABASE_URL" > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"
            test "$(tail -n 10 "$BACKUP_FILE" | grep -c -- '-- PostgreSQL database dump complete')" -ge 1
            gzip -f "$BACKUP_FILE"
            gzip -t "${BACKUP_FILE}.gz"
            sha256sum "${BACKUP_FILE}.gz" > "${BACKUP_FILE}.gz.sha256"
            echo "backup: ${BACKUP_FILE}.gz $(cut -c1-64 "${BACKUP_FILE}.gz.sha256")"

            COUNTS_SQL="SELECT string_agg(t || '=' || n, ' ' ORDER BY t) FROM ( SELECT 'companies' t, count(*) n FROM companies UNION ALL SELECT 'tenants', count(*) FROM tenants UNION ALL SELECT 'tenant_companies', count(*) FROM tenant_companies UNION ALL SELECT 'users', count(*) FROM users UNION ALL SELECT 'workers', count(*) FROM workers UNION ALL SELECT 'contractor_proposals', count(*) FROM contractor_proposals UNION ALL SELECT 'contractor_contracts', count(*) FROM contractor_contracts UNION ALL SELECT 'invoices', count(*) FROM invoices UNION ALL SELECT 'payments', count(*) FROM payments UNION ALL SELECT 'contractor_payments', count(*) FROM contractor_payments UNION ALL SELECT 'expense_payments', count(*) FROM expense_payments UNION ALL SELECT 'payroll_runs', count(*) FROM payroll_runs UNION ALL SELECT 'account_invites', count(*) FROM account_invites) s"
            BEFORE_COUNTS="$(PSQL -c "$COUNTS_SQL")"
            echo "before: $BEFORE_COUNTS"

            # Each file is a single transaction and records its own ledger row.
            psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f "$WORK/0029.sql"
            psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f "$WORK/0030.sql"

            AFTER_COUNTS="$(PSQL -c "$COUNTS_SQL")"
            echo "after:  $AFTER_COUNTS"
            test "$BEFORE_COUNTS" = "$AFTER_COUNTS"

            # Ledger: every version exactly once, 0029 and 0030 now present.
            LEDGER="$(PSQL -c "SELECT string_agg(version || 'x' || n, ',' ORDER BY version) FROM (SELECT version, count(*) n FROM paylink_migrations.applied GROUP BY version) s")"
            echo "ledger: $LEDGER"
            test "$LEDGER" = "0027x1,0028x1,0029x1,0030x1"
            PSQL -c "SELECT version || '|' || name || '|' || applied_at || '|' || applied_by FROM paylink_migrations.applied WHERE version IN ('0029','0030') ORDER BY version"

            # New objects exist and are empty; no company board is enabled.
            TABLES="$(PSQL -c "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relname ~ '^(job_|contractor_job_|employment_application)'")"
            echo "job board tables: $TABLES"
            test "$TABLES" = "19"
            test "$(PSQL -c "SELECT (SELECT count(*) FROM job_posts) + (SELECT count(*) FROM job_board_settings) + (SELECT count(*) FROM job_applicants)")" = "0"
            echo "Migrations 0029 and 0030 applied once each; protected counts unchanged; job board empty and disabled."
