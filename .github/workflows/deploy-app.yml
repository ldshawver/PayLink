name: Deploy PayLink App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            echo "Starting deployment..."

            cd /home/paylinkssh/paylink-app/PayLink

            git fetch origin main
            git reset --hard origin/main
            echo "✓ Repository updated"

            # Take ownership of any root-owned build artifacts from prior sudo runs.
            # This must happen before rm or pnpm, otherwise both will fail with EACCES.
            sudo chown -R paylinkssh:paylinkssh . 2>/dev/null || true

            rm -rf node_modules || {
              echo "❌ Cannot remove node_modules (still root-owned). Fix with:"
              echo "   ssh into VPS as root and run:"
              echo "   sudo chown -R paylinkssh:paylinkssh /home/paylinkssh/paylink-app/PayLink"
              exit 1
            }

            if ! command -v pnpm >/dev/null 2>&1; then
              sudo npm install -g pnpm@10.33.0
            fi
            pnpm -v
            pnpm install --frozen-lockfile=false --reporter=append-only
            echo "✓ Dependencies installed"

            rm -rf dist/
            pnpm build
            echo "✓ Build completed"

            # ── Nginx config update ──────────────────────────────────────────
            # Deploy the canonical nginx config so mypaylink.app proxies to the
            # Node app on port 8000.  Any CloudPanel-generated static-root config
            # is replaced.  nginx -t validates before reload so a bad config can
            # never take down a running server.
            NGINX_CONF_SRC="/home/paylinkssh/paylink-app/PayLink/scripts/nginx-mypaylink.conf"
            NGINX_CONF_DST="/etc/nginx/sites-enabled/mypaylink.app.conf"

            if sudo -n true 2>/dev/null; then
              if sudo cp "$NGINX_CONF_SRC" "$NGINX_CONF_DST" && sudo nginx -t; then
                sudo systemctl reload nginx
                echo "✓ Nginx config deployed and reloaded"
              else
                echo "⚠️  Nginx config validation failed — keeping existing config"
              fi
            else
              echo "⚠️  Passwordless sudo unavailable — skipping nginx deployment"
            fi

            # ── Pre-flight: verify env loads and required vars are set ───────
            echo "--- Pre-flight env check ---"
            node -e "
              process.argv[2]='dotenv_config_path=/etc/paylink/.env';
              require('dotenv/config');
              const r={PORT:process.env.PORT||'NOT SET',NODE_ENV:process.env.NODE_ENV||'NOT SET',HAS_DB:!!process.env.DATABASE_URL,HAS_SECRET:!!process.env.SESSION_SECRET};
              console.log(JSON.stringify(r));
              if(!process.env.DATABASE_URL){process.stderr.write('FATAL: DATABASE_URL missing from /etc/paylink/.env\n');process.exit(1);}
              if(!process.env.SESSION_SECRET){process.stderr.write('FATAL: SESSION_SECRET missing from /etc/paylink/.env\n');process.exit(1);}
              if(!process.env.PORT||process.env.PORT!=='8000'){process.stderr.write('FATAL: PORT must be 8000 in /etc/paylink/.env (got: '+(process.env.PORT||'unset')+'). Health check expects port 8000.\n');process.exit(1);}
            " 2>&1

            pm2 delete paylink 2>/dev/null || true

            APP_PATH="/home/paylinkssh/paylink-app/PayLink"
            pm2 start "$APP_PATH/dist/index.cjs" \
              --name paylink \
              --cwd "$APP_PATH" \
              --interpreter node \
              --node-args="--require dotenv/config" \
              -- dotenv_config_path=/etc/paylink/.env

            pm2 save --force
            echo "✓ Application started with PM2"

            sleep 5

            # Show early startup logs so crashes are immediately visible
            echo "--- PM2 startup logs (first 5s) ---"
            pm2 logs paylink --lines 30 --nostream || true

            for i in {1..30}; do
              if curl -fs http://127.0.0.1:8000/health > /dev/null; then
                echo "✓ Health check passed"
                echo ""
                echo "=== Verifying public routing ==="
                HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 https://mypaylink.app/health 2>/dev/null || echo "ERR")
                if [ "$HTTP_CODE" = "200" ]; then
                  echo "✓ Public https://mypaylink.app/health → $HTTP_CODE (nginx routing OK)"
                else
                  echo "⚠️  Public https://mypaylink.app/health → $HTTP_CODE (nginx may need manual sudo fix — see replit.md)"
                fi
                echo "✓ Deployment successful"
                exit 0
              fi

              if [ $i -eq 30 ]; then
                echo "❌ Health check failed after 30 attempts"
                pm2 status
                pm2 logs paylink --lines 80 --nostream
                exit 1
              fi

              sleep 2
            done
