name: Deploy Private App

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-private-app-production
  cancel-in-progress: true

jobs:
  deploy_app:
    name: Deploy app.mypaylink.app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app deploy secrets
        run: |
          [ -n "${{ secrets.APP_VPS_HOST }}" ] || { echo "Missing APP_VPS_HOST"; exit 1; }
          [ -n "${{ secrets.APP_VPS_USER }}" ] || { echo "Missing APP_VPS_USER"; exit 1; }
          [ -n "${{ secrets.APP_VPS_PORT }}" ] || { echo "Missing APP_VPS_PORT"; exit 1; }
          [ -n "${{ secrets.APP_VPS_SSH_KEY }}" ] || { echo "Missing APP_VPS_SSH_KEY"; exit 1; }

      - name: Deploy private app over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_NAME="paylink"
            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            APP_ENTRY="$APP_DIR/dist/index.cjs"
            APP_PORT="8000"
            ENV_FILE="/etc/paylink/.env"

            echo "========== PRIVATE APP DEPLOY START =========="
            echo "User: $(whoami)"
            echo "App dir: $APP_DIR"

            test -d "$APP_DIR" || { echo "ERROR: Missing repo dir: $APP_DIR"; exit 1; }
            cd "$APP_DIR"

            echo "==> Git sync"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Versions"
            node -v
            npm -v
            pm2 -v

            echo "==> Validate repo files"
            test -f "$APP_DIR/package.json" || { echo "ERROR: Missing package.json"; exit 1; }
            test -f "$ENV_FILE" || { echo "ERROR: Missing env file: $ENV_FILE"; exit 1; }

            echo "==> Clean install state"
            rm -rf node_modules

            echo "==> Install dependencies"
            npm ci

            echo "==> Build app"
            npm run build

            echo "==> Verify build output"
            test -f "$APP_ENTRY" || { echo "ERROR: Missing build artifact: $APP_ENTRY"; exit 1; }

            echo "==> Restart PM2 app"
            pm2 delete "$APP_NAME" 2>/dev/null || true
            sleep 2

            pm2 start "$APP_ENTRY" \
              --name "$APP_NAME" \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              --restart-delay 5000 \
              --max-restarts 5 \
              -- dotenv_config_path="$ENV_FILE"

            echo "==> Save PM2 process list"
            pm2 save --force

            echo "==> Wait for startup"
            sleep 15

            echo "==> PM2 diagnostics"
            pm2 list
            pm2 describe "$APP_NAME" || true
            pm2 logs "$APP_NAME" --lines 100 --nostream || true

            echo "==> Port check"
            ss -tlnp | grep ":$APP_PORT" || true

            echo "==> Health checks"
            HEALTH_CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$APP_PORT/health || true)"
            READY_CODE="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$APP_PORT/ready || true)"
            echo "Health: $HEALTH_CODE | Ready: $READY_CODE"

            if [ "$HEALTH_CODE" != "200" ] && [ "$READY_CODE" != "200" ]; then
              echo "ERROR: Private app failed health checks"
              pm2 logs "$APP_NAME" --lines 150 --nostream || true
              exit 1
            fi

            echo "========== PRIVATE APP DEPLOY SUCCESS =========="
