name: Deploy PayLink App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            echo "Starting deployment..."

            cd /home/paylinkssh/paylink-app/PayLink

            git fetch origin main
            git reset --hard origin/main
            echo "✓ Repository updated"

            npm ci --legacy-peer-deps
            echo "✓ Dependencies installed"

            npm run build
            echo "✓ Build completed"

            pm2 delete paylink 2>/dev/null || true

            pm2 start dist/index.cjs \
              --name paylink \
              --cwd /home/paylinkssh/paylink-app/PayLink \
              --interpreter node \
              --node-args="-r dotenv/config" \
              -- dotenv_config_path=/etc/paylink/.env

            pm2 save --force
            echo "✓ Application started with PM2"

            sleep 5

            for i in {1..30}; do
              if curl -fs http://127.0.0.1:8000/health > /dev/null; then
                echo "✓ Health check passed"
                echo "✓ Deployment successful"
                exit 0
              fi

              if [ $i -eq 30 ]; then
                echo "❌ Health check failed after 30 attempts"
                pm2 status
                pm2 logs paylink --lines 80 --nostream
                exit 1
              fi

              sleep 2
            done
