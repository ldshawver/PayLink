name: Deploy PayLink App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH connectivity
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 1m
          script_stop: true
          script: |
            echo "SSH connectivity OK — host: $(hostname), user: $(whoami)"

      - name: Pre-flight environment check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 2m
          script_stop: true
          script: |
            set -e
            ENV_FILE="/etc/paylink/.env"

            echo "--- Pre-flight: checking $ENV_FILE ---"
            if [ ! -f "$ENV_FILE" ]; then
              echo "FATAL: $ENV_FILE does not exist."
              exit 1
            fi

            set -a
            source "$ENV_FILE"
            set +a

            MISSING=""
            [ -z "$DATABASE_URL" ] && MISSING="$MISSING DATABASE_URL"
            [ -z "$SESSION_SECRET" ] && MISSING="$MISSING SESSION_SECRET"
            [ -z "$APP_BASE_URL" ] && MISSING="$MISSING APP_BASE_URL"

            if [ -n "$MISSING" ]; then
              echo "FATAL: Missing required environment variables:$MISSING"
              exit 1
            fi

            echo "Pre-flight passed."

      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 30m
          script_stop: false
          script: |
            set -e
            echo "Starting deployment — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            APP_PATH="/home/paylinkssh/paylink-app/PayLink"
            cd "$APP_PATH"

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "Previous commit: ${PREV_COMMIT:-none}"

            git fetch origin main
            git reset --hard origin/main

            NEW_COMMIT=$(git rev-parse HEAD)
            echo "Repository updated → $NEW_COMMIT"

            sudo chown -R paylinkssh:paylinkssh . 2>/dev/null || true

            rm -rf node_modules || {
              echo "Cannot remove node_modules. Fix ownership first:"
              echo "sudo chown -R paylinkssh:paylinkssh $APP_PATH"
              exit 1
            }

            if ! command -v pnpm >/dev/null 2>&1; then
              sudo npm install -g pnpm@10.33.0
            fi

            pnpm -v
            pnpm install --frozen-lockfile=false --reporter=append-only

            rm -rf dist/
            pnpm build

            NGINX_CONF_SRC="$APP_PATH/scripts/nginx-mypaylink.conf"
            NGINX_CONF_DST="/etc/nginx/sites-enabled/mypaylink.app.conf"

            if sudo -n true 2>/dev/null; then
              if sudo cp "$NGINX_CONF_SRC" "$NGINX_CONF_DST" && sudo nginx -t; then
                sudo systemctl reload nginx
                echo "Nginx config deployed and reloaded"
              else
                echo "Nginx validation failed — keeping existing config"
              fi
            else
              echo "Passwordless sudo unavailable — skipping nginx deployment"
            fi

            pm2 delete paylink 2>/dev/null || true

            pm2 start "$APP_PATH/dist/index.cjs" \
              --name paylink \
              --cwd "$APP_PATH" \
              --interpreter node \
              --node-args="--require dotenv/config" \
              -- dotenv_config_path=/etc/paylink/.env

            pm2 save --force

            sleep 5

            HEALTH_OK=0
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:8000/health >/dev/null 2>&1; then
                HEALTH_OK=1
                echo "Health check passed"
                break
              fi
              echo "Waiting for health check... attempt $i/30"
              sleep 3
            done

            if [ "$HEALTH_OK" = "0" ]; then
              echo "Health check failed — triggering rollback"
              pm2 logs paylink --lines 80 --nostream || true

              if [ -n "$PREV_COMMIT" ]; then
                git reset --hard "$PREV_COMMIT"
                pnpm install --frozen-lockfile=false --reporter=append-only || true
                pnpm build || true

                pm2 delete paylink 2>/dev/null || true
                pm2 start "$APP_PATH/dist/index.cjs" \
                  --name paylink \
                  --cwd "$APP_PATH" \
                  --interpreter node \
                  --node-args="--require dotenv/config" \
                  -- dotenv_config_path=/etc/paylink/.env

                pm2 save --force

                sleep 5
                curl -fs http://127.0.0.1:8000/health >/dev/null 2>&1 || {
                  echo "Rollback also failed — manual intervention required"
                  exit 1
                }

                echo "Rollback successful"
              else
                echo "No previous commit recorded — cannot rollback"
              fi

              exit 1
            fi

            PUBLIC_OK=0
            for j in $(seq 1 6); do
              HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 https://mypaylink.app/health 2>/dev/null || echo "ERR")
              if [ "$HTTP_CODE" = "200" ]; then
                PUBLIC_OK=1
                echo "Public health check passed"
                break
              fi
              echo "Public health attempt $j/6 → $HTTP_CODE"
              sleep 5
            done

            if [ "$PUBLIC_OK" = "0" ]; then
              echo "Public health check failed"
              exit 1
            fi

            echo "Deployment complete — commit $NEW_COMMIT"

      - name: Notify success
        if: success()
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "PayLink deployed successfully"
          to: ${{ secrets.DEPLOY_NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          html_body: |
            <p><strong>PayLink deployed successfully.</strong></p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Actions run</a></p>
            <p><a href="https://mypaylink.app/health">Check PayLink health</a></p>

      - name: Notify failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "PayLink deploy FAILED"
          to: ${{ secrets.DEPLOY_NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          html_body: |
            <p><strong>PayLink deployment failed.</strong></p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Actions run</a></p>
            <p><a href="https://mypaylink.app/health">Check PayLink health</a></p>
