name: Deploy PayLink App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      DEPLOY_NOTIFY_EMAIL: ${{ secrets.DEPLOY_NOTIFY_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --reporter=append-only

      - name: Typecheck
        run: pnpm typecheck

      - name: Signing route regression tests
        run: |
          pnpm exec tsx tests/contract-signing-redirect-static.test.ts
          pnpm exec tsx tests/contract-documenso-static.test.ts
          pnpm exec tsx tests/contract-signer-management-static.test.ts
          pnpm exec tsx tests/mypaylink-nginx-signing-static.test.ts

      - name: Build
        run: pnpm build

      - name: Verify SSH connectivity
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 1m
          script_stop: true
          script: |
            echo "SSH connectivity OK — host: $(hostname), user: $(whoami)"

      - name: Pre-flight environment check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 2m
          script_stop: true
          script: |
            bash <<'PAYLINK_PREFLIGHT'
            set -euxo pipefail

            ENV_FILE="/etc/paylink/.env"

            echo "--- Pre-flight: checking $ENV_FILE ---"
            echo "Host: $(hostname)"
            echo "User: $(whoami)"
            echo "Env file exists: $(test -f "$ENV_FILE" && echo yes || echo no)"

            if [ ! -f "$ENV_FILE" ]; then
              echo "FATAL: $ENV_FILE does not exist."
              exit 1
            fi

            echo "--- Checking required vars without sourcing unsafe env file ---"

            echo "DATABASE_URL matches:"
            grep -n '^DATABASE_URL=' "$ENV_FILE" | sed 's/=.*$/=<redacted>/' || true

            echo "SESSION_SECRET matches:"
            grep -n '^SESSION_SECRET=' "$ENV_FILE" | sed 's/=.*$/=<redacted>/' || true

            echo "APP_BASE_URL matches:"
            grep -n '^APP_BASE_URL=' "$ENV_FILE" | sed 's/=.*$/=<redacted>/' || true

            MISSING=""
            if ! grep -q '^DATABASE_URL=.' "$ENV_FILE"; then MISSING="$MISSING DATABASE_URL"; fi
            if ! grep -q '^SESSION_SECRET=.' "$ENV_FILE"; then MISSING="$MISSING SESSION_SECRET"; fi
            if ! grep -q '^APP_BASE_URL=.' "$ENV_FILE"; then MISSING="$MISSING APP_BASE_URL"; fi

            if [ -n "$MISSING" ]; then
              echo "FATAL: Missing required environment variables:$MISSING"
              echo ""
              echo "Detected keys:"
              grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "$ENV_FILE" | cut -d= -f1 | sort || true
              exit 1
            fi

            echo "Pre-flight passed."
            PAYLINK_PREFLIGHT

      - name: Deploy to VPS
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 30m
          script_stop: false
          script: |
            set -uo pipefail
            echo "Starting deployment — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

            APP_PATH="/home/paylinkssh/paylink-app/PayLink"
            cd "$APP_PATH" || exit 1

            PREV_COMMIT=$(git rev-parse HEAD 2>/dev/null || echo "")
            echo "Previous commit: ${PREV_COMMIT:-none}"

            rollback() {
              reason="$1"
              echo "Deployment failed: $reason — triggering rollback"
              pm2 logs paylink --lines 80 --nostream || true

              if [ -z "$PREV_COMMIT" ]; then
                echo "No previous commit recorded — cannot rollback"
                return 1
              fi

              git reset --hard "$PREV_COMMIT" || return 1
              pnpm install --frozen-lockfile=false --reporter=append-only || true
              pnpm build || true

              pm2 delete paylink 2>/dev/null || true
              ROLLBACK_BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
              PAYLINK_COMMIT="$PREV_COMMIT" PAYLINK_BUILD_TIME="$ROLLBACK_BUILD_TIME" pm2 start "$APP_PATH/dist/index.cjs" \
                --name paylink \
                --cwd "$APP_PATH" \
                --interpreter node \
                --node-args="--require dotenv/config" \
                -- dotenv_config_path=/etc/paylink/.env || return 1

              pm2 save --force || true

              sleep 5
              curl -fs http://127.0.0.1:8000/health >/dev/null 2>&1 || {
                echo "Rollback also failed — manual intervention required"
                return 1
              }

              echo "Rollback successful"
              return 0
            }

            git fetch origin main || exit 1
            git reset --hard origin/main || exit 1

            NEW_COMMIT=$(git rev-parse HEAD) || exit 1
            echo "✔ Repository updated"
            echo "Repository commit → $NEW_COMMIT"

            sudo chown -R paylinkssh:paylinkssh . 2>/dev/null || true

            rm -rf node_modules || {
              echo "Cannot remove node_modules."
              echo "Run: sudo chown -R paylinkssh:paylinkssh $APP_PATH"
              exit 1
            }

            if ! command -v pnpm >/dev/null 2>&1; then
              sudo npm install -g pnpm@10.33.0 || exit 1
            fi

            pnpm install --frozen-lockfile=false --reporter=append-only || exit 1
            echo "✔ Dependencies installed"

            rm -rf dist/
            if ! pnpm build; then
              rollback "build failed" || true
              exit 1
            fi
            echo "✔ Build successful"

            NGINX_CONF_SRC="$APP_PATH/scripts/nginx-mypaylink.conf"
            NGINX_STATUS="skipped"
            if sudo -n true 2>/dev/null; then
              NGINX_LOG=$(mktemp)
              if "$APP_PATH/scripts/apply_mypaylink_nginx.sh" "$NGINX_CONF_SRC" 2>&1 | tee "$NGINX_LOG"; then
                if grep -q "Nginx configuration updated and reloaded" "$NGINX_LOG"; then
                  NGINX_STATUS="updated"
                else
                  NGINX_STATUS="skipped"
                fi
              else
                echo "Warning: nginx configuration could not be applied; continuing deployment"
                NGINX_STATUS="skipped"
              fi
              rm -f "$NGINX_LOG"
            else
              echo "Skipping nginx configuration (no passwordless sudo)"
              NGINX_STATUS="skipped"
            fi

            pm2 delete paylink 2>/dev/null || true

            PAYLINK_BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

            if ! PAYLINK_COMMIT="$NEW_COMMIT" PAYLINK_BUILD_TIME="$PAYLINK_BUILD_TIME" pm2 start "$APP_PATH/dist/index.cjs" \
              --name paylink \
              --cwd "$APP_PATH" \
              --interpreter node \
              --node-args="--require dotenv/config" \
              -- dotenv_config_path=/etc/paylink/.env; then
              rollback "PM2 start failed" || true
              exit 1
            fi

            pm2 save --force || true
            echo "✔ PM2 restarted"

            sleep 5

            HEALTH_OK=0
            for i in $(seq 1 30); do
              if curl -fs http://127.0.0.1:8000/health >/dev/null 2>&1; then
                HEALTH_OK=1
                echo "✔ Local health passed"
                break
              fi
              echo "Waiting for local health check... attempt $i/30"
              sleep 3
            done

            if [ "$HEALTH_OK" = "0" ]; then
              rollback "local health endpoint failed" || true
              exit 1
            fi

            PUBLIC_OK=0
            for j in $(seq 1 6); do
              HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 15 https://mypaylink.app/health 2>/dev/null || echo "ERR")
              if [ "$HTTP_CODE" = "200" ]; then
                PUBLIC_OK=1
                echo "✔ Public health passed"
                break
              fi
              echo "Public health attempt $j/6 → $HTTP_CODE"
              sleep 5
            done

            if [ "$PUBLIC_OK" = "0" ]; then
              rollback "public health endpoint failed" || true
              exit 1
            fi

            if [ "$NGINX_STATUS" = "updated" ]; then
              echo "✔ Nginx updated"
            else
              echo "✔ Nginx skipped"
            fi

            echo "Deployment successful"
            echo "Deployment complete — commit $NEW_COMMIT"

      - name: Production signing smoke tests
        if: success()
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          BASE_URL: https://mypaylink.app
          APP_BASE_URL: https://app.mypaylink.app
          REPORT_FILE: deployment-smoke-artifacts/documenso-signing-smoke-report.txt
        run: |
          mkdir -p deployment-smoke-artifacts
          ./scripts/verify_documenso_signing.sh

      - name: Write deployment manifest
        if: always()
        run: |
          mkdir -p deployment-smoke-artifacts
          cat > deployment-smoke-artifacts/deployment-manifest.json <<MANIFEST
          {
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "actor": "${{ github.actor }}",
            "workflow": "${{ github.workflow }}",
            "generated_at": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          }
          MANIFEST

      - name: Upload deployment smoke artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: paylink-deployment-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-smoke-artifacts/
          retention-days: 30

      - name: Skip success email when recipients are empty
        if: success() && env.DEPLOY_NOTIFY_EMAIL == ''
        run: echo "Skipping email notification (no recipients configured)"

      - name: Notify success
        if: success() && env.DEPLOY_NOTIFY_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: PayLink deployed successfully
          to: ${{ env.DEPLOY_NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          html_body: |
            <p><strong>PayLink deployed successfully.</strong></p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Actions run</a></p>
            <p><a href="https://mypaylink.app/health">Check PayLink health</a></p>

      - name: Skip failure email when recipients are empty
        if: failure() && env.DEPLOY_NOTIFY_EMAIL == ''
        run: echo "Skipping email notification (no recipients configured)"

      - name: Notify failure
        if: failure() && env.DEPLOY_NOTIFY_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: PayLink deploy FAILED
          to: ${{ env.DEPLOY_NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          html_body: |
            <p><strong>PayLink deployment failed.</strong></p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
            <p><strong>Triggered by:</strong> ${{ github.actor }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Actions run</a></p>
            <p><a href="https://mypaylink.app/health">Check PayLink health</a></p>
