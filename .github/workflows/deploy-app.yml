name: PayLink CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-tests:
    name: Security & Compliance Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paylink
          POSTGRES_PASSWORD: paylink
          POSTGRES_DB: paylink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://paylink:paylink@localhost:5432/paylink_test
        run: npm run db:push

      - name: Start application (background)
        env:
          DATABASE_URL: postgresql://paylink:paylink@localhost:5432/paylink_test
          SESSION_SECRET: ci-session-secret
          NODE_ENV: test
        run: |
          npm run dev > /tmp/app.log 2>&1 &
          APP_PID=$!
          echo "App started with PID: $APP_PID"
          sleep 5
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "❌ App crashed during startup:"
            cat /tmp/app.log
            exit 1
          fi
          npx wait-on http://localhost:5000/ready --timeout 30000 || (echo "❌ Health check failed. App logs:" && cat /tmp/app.log && exit 1)
          echo "✓ App is ready"

      - name: Run security & compliance tests
        env:
          DATABASE_URL: postgresql://paylink:paylink@localhost:5432/paylink_test
        run: npx tsx tests/security.test.ts

      - name: Scan for hardcoded secrets
        run: |
          # Fail if obvious hardcoded credentials are found in source files
          FOUND=$(grep -rEn \
            "(password|secret|api_key|apikey|private_key|auth_token)\s*[:=]\s*['\"][^'\"]{12,}['\"]" \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=dist \
            server/ client/ shared/ 2>/dev/null | \
            grep -v "process\.env\|getenv\|EXAMPLE\|placeholder\|bcrypt\|MASKED\|ANONYMIZED\|XXXX\|your-\|<YOUR\|TODO\|test\|spec" \
            || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Possible hardcoded secret(s) detected:"
            echo "$FOUND"
            exit 1
          fi
          echo "No obvious hardcoded secrets detected."

      - name: npm audit (high severity gate)
        run: npm audit --audit-level=high

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: security-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          port: ${{ secrets.APP_VPS_PORT || 22 }}
          username: ${{ secrets.APP_VPS_USER || 'paylinkssh' }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          script: |
            set -e
            echo "Starting deployment..."
            cd /home/paylinkssh/paylink-app/PayLink || exit 1
            
            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Repository updated"
            
            # Install dependencies
            npm ci --legacy-peer-deps
            echo "✓ Dependencies installed"
            
            # Build application
            npm run build
            echo "✓ Build completed"
            
            # Stop existing PM2 app if running
            pm2 delete paylink || true
            
            # Start application with PM2
            pm2 start dist/index.cjs \
              --name paylink \
              --cwd /home/paylinkssh/paylink-app/PayLink \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --env-file /etc/paylink/.env
            
            pm2 save --force
            echo "✓ Application started with PM2"
            
            # Wait for app to be healthy
            sleep 5
            for i in {1..30}; do
              if curl -fs http://127.0.0.1:8001/ready > /dev/null; then
                echo "✓ Health check passed"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Health check failed after 30 attempts"
                pm2 logs paylink --lines 50 --nostream
                exit 1
              fi
              sleep 1
            done
            
            echo "✓ Deployment successful"
