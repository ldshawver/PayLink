name: PayLink CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-tests:
    name: Security & Compliance Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paylink
          POSTGRES_PASSWORD: paylink
          POSTGRES_DB: paylink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://paylink:paylink@localhost:5432/paylink_test
        run: npm run db:push

      - name: Start application (background)
        env:
          DATABASE_URL: postgresql://paylink:paylink@localhost:5432/paylink_test
          SESSION_SECRET: ci-session-secret
          NODE_ENV: test
        run: |
          npm run dev &
          npx wait-on http://localhost:5000/api/auth/me --timeout 60000

      - name: Run security & compliance tests
        env:
          DATABASE_URL: postgresql://paylink:paylink@localhost:5432/paylink_test
        run: npx tsx tests/security.test.ts

      - name: npm audit (high severity gate)
        run: npm audit --audit-level=high

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: security-tests

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          port: ${{ secrets.APP_VPS_PORT || 22 }}
          username: ${{ secrets.APP_VPS_USER || 'paylinkssh' }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/paylinkssh/paylink-app/PayLink
            git pull origin main
            npm ci --legacy-peer-deps
            npm run build
            pm2 restart paylink || pm2 start dist/index.cjs --name paylink \
              --cwd /home/paylinkssh/paylink-app/PayLink \
              --interpreter node --node-args="-r dotenv/config" \
              -- dotenv_config_path=/etc/paylink/.env
            pm2 save --force
            sleep 10
            curl -fs http://127.0.0.1:8001/health || (pm2 logs paylink --lines 30 --nostream && exit 1)
