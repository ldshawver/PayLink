name: Deploy PayLink App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          command_timeout: 30m
          # Let the shell script decide which non-zero checks are fatal.
          # appleboy's script_stop treats optional probes like "sudo -n true"
          # as hard failures before the script can enter its fallback branch.
          script_stop: false
          script: |
            set -e
            echo "=== PayLink Deploy $(date -u '+%Y-%m-%dT%H:%M:%SZ') ==="

            cd /home/paylinkssh/paylink-app/PayLink

            git fetch origin main
            git reset --hard origin/main
            echo "✓ Repository updated ($(git rev-parse --short HEAD))"

            # Take ownership of any root-owned build artifacts from prior sudo runs.
            # This must happen before rm or pnpm, otherwise both will fail with EACCES.
            sudo chown -R paylinkssh:paylinkssh . 2>/dev/null || true

            rm -rf node_modules || {
              echo "❌ Cannot remove node_modules (still root-owned). Fix with:"
              echo "   ssh into VPS as root and run:"
              echo "   sudo chown -R paylinkssh:paylinkssh /home/paylinkssh/paylink-app/PayLink"
              exit 1
            }

            if ! command -v pnpm >/dev/null 2>&1; then
              sudo npm install -g pnpm@10.33.0
            fi
            pnpm -v
            pnpm install --frozen-lockfile=false --reporter=append-only
            echo "✓ Dependencies installed"

            # ── Build — redirect verbose Vite output to a temp file ────────────
            # The SSH action has a finite output buffer; Vite's asset manifest
            # output can easily push PM2 crash logs past the visible window.
            BUILD_LOG=/tmp/paylink-build.log
            rm -f "$BUILD_LOG"
            if pnpm build > "$BUILD_LOG" 2>&1; then
              echo "✓ Build completed ($(wc -l < "$BUILD_LOG") lines of output suppressed)"
            else
              echo "❌ Build failed — last 60 lines:"
              tail -60 "$BUILD_LOG"
              exit 1
            fi

            # ── Nginx config update ──────────────────────────────────────────
            # Deploy the canonical nginx config so mypaylink.app proxies to the
            # Node app on port 8000.  Any CloudPanel-generated static-root config
            # is replaced.  nginx -t validates before reload so a bad config can
            # never take down a running server.
            NGINX_CONF_SRC="/home/paylinkssh/paylink-app/PayLink/scripts/nginx-mypaylink.conf"
            NGINX_CONF_DST="/etc/nginx/sites-enabled/mypaylink.app.conf"

            if sudo -n true 2>/dev/null; then
              if sudo cp "$NGINX_CONF_SRC" "$NGINX_CONF_DST" && sudo nginx -t; then
                sudo systemctl reload nginx
                echo "✓ Nginx config deployed and reloaded"
              else
                echo "⚠️  Nginx config validation failed — keeping existing config"
              fi
            else
              echo "⚠️  Passwordless sudo unavailable — skipping nginx deployment"
            fi

            # ── Pre-flight: verify env loads and PORT is configured ────────
            echo "--- Pre-flight env check ---"
            node -e "
              process.argv[2]='dotenv_config_path=/etc/paylink/.env';
              require('dotenv/config');
              const r={PORT:process.env.PORT||'NOT SET',NODE_ENV:process.env.NODE_ENV||'NOT SET',HAS_DB:!!process.env.DATABASE_URL,HAS_SECRET:!!process.env.SESSION_SECRET};
              console.log(JSON.stringify(r));
              if(!process.env.DATABASE_URL){process.stderr.write('ERROR: DATABASE_URL missing\n');process.exit(1);}
              if(!process.env.SESSION_SECRET){process.stderr.write('ERROR: SESSION_SECRET missing\n');process.exit(1);}
              if(!process.env.PORT){process.stderr.write('WARN: PORT not set, defaulting to 5000 — health check expects 8000\n');}
            " 2>&1

            pm2 delete paylink 2>/dev/null || true

            APP_PATH="/home/paylinkssh/paylink-app/PayLink"
            pm2 start "$APP_PATH/dist/index.cjs" \
              --name paylink \
              --cwd "$APP_PATH" \
              --interpreter node \
              --node-args="--require dotenv/config" \
              -- dotenv_config_path=/etc/paylink/.env

            pm2 save --force
            echo "✓ PM2 process registered"

            # ── Early crash detection ─────────────────────────────────────────
            # PM2 starts the process asynchronously. Wait a few seconds and check
            # whether the process is still online before entering the health loop.
            # If it crashed immediately, show logs now (before output buffer fills up).
            sleep 4
            echo "--- PM2 status after startup ---"
            pm2 status paylink
            if pm2 list | grep -E "paylink\s+\|.*online" > /dev/null 2>&1 || \
               pm2 jlist 2>/dev/null | grep -E '"name":"paylink".*"status":"online"' > /dev/null 2>&1 || \
               pm2 status paylink 2>&1 | grep -q "online"; then
              echo "✓ PM2 process is online — starting health checks"
            else
              echo "❌ PM2 process is NOT online — crashed on startup"
              echo "--- PM2 crash logs (last 100 lines) ---"
              pm2 logs paylink --lines 100 --nostream
              exit 1
            fi

            # ── Health check loop ─────────────────────────────────────────────
            # 30 attempts × 2 s = 60 s total. PM2 crash logs are dumped at
            # attempt 5 (early signal) and again at attempt 30 (final failure).
            for i in {1..30}; do
              if curl -fs http://127.0.0.1:8000/health > /dev/null; then
                echo "✓ Health check passed (attempt $i)"
                echo ""
                echo "=== Verifying public routing ==="
                HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" --max-time 10 https://mypaylink.app/health 2>/dev/null || echo "ERR")
                if [ "$HTTP_CODE" = "200" ]; then
                  echo "✓ Public https://mypaylink.app/health → $HTTP_CODE (nginx routing OK)"
                else
                  echo "⚠️  Public https://mypaylink.app/health → $HTTP_CODE (nginx may need manual sudo fix — see replit.md)"
                fi
                echo "✓ Deployment successful"
                exit 0
              fi

              # Mid-loop crash log dump — show PM2 logs early so they appear
              # near the top of the failure output, before the buffer fills up.
              if [ $i -eq 5 ]; then
                echo "⏳ Health check not yet passing (attempt $i/30) — PM2 snapshot:"
                pm2 status paylink
                echo "--- PM2 logs (last 50 lines, attempt $i) ---"
                pm2 logs paylink --lines 50 --nostream
                echo "--- (continuing health checks) ---"
              fi

              if [ $i -eq 30 ]; then
                echo "❌ Health check failed after 30 attempts (60 s)"
                echo "--- PM2 crash logs (last 100 lines) ---"
                pm2 logs paylink --lines 100 --nostream
                echo "--- PM2 final status ---"
                pm2 status
                exit 1
              fi

              sleep 2
            done
