name: Deploy MyPayLink Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-mypaylink-staging
  cancel-in-progress: true

jobs:
  deploy_staging:
    name: Deploy staging.mypaylink.app to port 8010
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_PATH: /home/paylinkssh/paylink-staging/PayLink
      ENV_FILE: /etc/paylink/staging.env
      PM2_NAME: paylink-staging
      APP_PORT: "8010"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --reporter=append-only

      - name: Typecheck
        run: pnpm typecheck

      - name: Signing route regression tests
        run: |
          pnpm exec tsx tests/contract-signing-redirect-static.test.ts
          pnpm exec tsx tests/contract-documenso-static.test.ts
          pnpm exec tsx tests/contract-signer-management-static.test.ts
          pnpm exec tsx tests/mypaylink-nginx-signing-static.test.ts

      - name: Build
        run: pnpm build

      - name: Deploy to staging VPS path
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 30m
          script_stop: true
          script: |
            set -Eeuo pipefail

            APP_PATH="/home/paylinkssh/paylink-staging/PayLink"
            ENV_FILE="/etc/paylink/staging.env"
            PM2_NAME="paylink-staging"
            APP_PORT="8010"

            echo "Deploying MyPayLink staging only"
            echo "APP_PATH=$APP_PATH"
            echo "ENV_FILE=$ENV_FILE"
            echo "PM2_NAME=$PM2_NAME"
            echo "APP_PORT=$APP_PORT"
            test -f "$ENV_FILE"

            cd "$APP_PATH"
            git fetch origin main
            git reset --hard origin/main
            NEW_COMMIT=$(git rev-parse HEAD)
            BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10.33.0
            fi

            pnpm install --frozen-lockfile=false --reporter=append-only
            rm -rf dist/
            pnpm build

            pm2 delete "$PM2_NAME" 2>/dev/null || true
            PORT="$APP_PORT" PAYLINK_COMMIT="$NEW_COMMIT" PAYLINK_BUILD_TIME="$BUILD_TIME" pm2 start "$APP_PATH/dist/index.cjs" \
              --name "$PM2_NAME" \
              --cwd "$APP_PATH" \
              --interpreter node \
              --node-args="--require dotenv/config" \
              -- dotenv_config_path="$ENV_FILE"
            pm2 save --force || true

            for i in $(seq 1 30); do
              if curl -fs "http://127.0.0.1:${APP_PORT}/health" >/dev/null 2>&1; then
                echo "Staging health passed on ${APP_PORT}"
                exit 0
              fi
              sleep 3
            done
            echo "Staging health failed on ${APP_PORT}" >&2
            exit 1
