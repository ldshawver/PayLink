name: Deploy Marketing Site (manual production)

on:
  workflow_dispatch:

concurrency:
  group: deploy-marketing-production
  cancel-in-progress: true

jobs:
  deploy_marketing:
    name: Deploy mypaylink.app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate marketing deploy secrets
        run: |
          [ -n "${{ secrets.MKT_VPS_HOST }}" ] || { echo "Missing MKT_VPS_HOST"; exit 1; }
          [ -n "${{ secrets.MKT_VPS_USER }}" ] || { echo "Missing MKT_VPS_USER"; exit 1; }
          [ -n "${{ secrets.MKT_VPS_PORT }}" ] || { echo "Missing MKT_VPS_PORT"; exit 1; }
          [ -n "${{ secrets.MKT_VPS_SSH_KEY }}" ] || { echo "Missing MKT_VPS_SSH_KEY"; exit 1; }

      - name: Deploy marketing site over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MKT_VPS_HOST }}
          username: ${{ secrets.MKT_VPS_USER }}
          key: ${{ secrets.MKT_VPS_SSH_KEY }}
          port: ${{ secrets.MKT_VPS_PORT }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            MARKETING_PUBLIC="/var/tmp/paylink-marketing-build"
            WEB_ROOT="/home/mypaylink/htdocs/mypaylink.app"

            echo "========== MARKETING DEPLOY START =========="
            echo "User: $(whoami)"
            echo "Marketing public: $MARKETING_PUBLIC"
            echo "Web root: $WEB_ROOT"

            test -d "$MARKETING_PUBLIC" || { echo "ERROR: Missing shared marketing build dir: $MARKETING_PUBLIC"; exit 1; }
            test -d "$WEB_ROOT" || { echo "ERROR: Missing marketing web root: $WEB_ROOT"; exit 1; }

            echo "==> Sync static marketing files"
            rsync -av --delete "$MARKETING_PUBLIC/" "$WEB_ROOT/"

            echo "==> Fix file permissions"
            find "$WEB_ROOT" -type f -exec chmod 644 {} \;
            find "$WEB_ROOT" -type d -exec chmod 755 {} \;

            echo "========== MARKETING DEPLOY SUCCESS =========="
