name: PayLink CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  repo-audit:
    name: repo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check forbidden files
        run: |
          echo "Checking for dangerous committed files..."
          ! git ls-files | grep -E '(^|/)(\.env|\.venv|node_modules|id_rsa|id_ed25519|.*\.pem|.*\.db|.*\.sqlite|.*\.sqlite3)$'

  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Typecheck
        run: |
          if pnpm run | grep -q "typecheck"; then
            pnpm typecheck
          elif npm run | grep -q "typecheck"; then
            npm run typecheck
          else
            echo "No typecheck script found. Skipping."
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build
        run: |
          if pnpm run | grep -q "build"; then
            pnpm build
          elif npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping."
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile || pnpm install
          elif [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Test
        run: |
          if pnpm run | grep -q "test"; then
            pnpm test
          elif npm run | grep -q "test"; then
            npm test
          else
            echo "No test script found. Skipping."
          fi
