name: Deploy MyPayLink Production

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Required release tag to deploy to production"
        required: true
        type: string

concurrency:
  group: deploy-mypaylink-production
  cancel-in-progress: false

jobs:
  deploy_production:
    name: Deploy production manually to port 8000
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_PATH: /home/paylinkssh/paylink-app/PayLink
      # Established production environment file on the VPS (see also scripts/backup-db.sh).
      ENV_FILE: /etc/paylink/.env
      PM2_NAME: paylink
      APP_PORT: "8000"
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Validate release tag input
        run: test -n "$RELEASE_TAG"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --reporter=append-only

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Deploy release tag to production VPS path
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_VPS_HOST }}
          username: ${{ secrets.APP_VPS_USER }}
          key: ${{ secrets.APP_VPS_SSH_KEY }}
          port: ${{ secrets.APP_VPS_PORT }}
          timeout: 30s
          command_timeout: 40m
          script_stop: true
          script: |
            set -Eeuo pipefail

            APP_PATH="/home/paylinkssh/paylink-app/PayLink"
            ENV_FILE="/etc/paylink/.env"
            PM2_NAME="paylink"
            APP_PORT="8000"
            RELEASE_TAG="${{ inputs.release_tag }}"
            BACKUP_DIR="/home/paylinkssh/paylink-db-backups"

            echo "Deploying MyPayLink production release tag: $RELEASE_TAG"
            echo "APP_PATH=$APP_PATH"
            echo "ENV_FILE=$ENV_FILE"
            echo "PM2_NAME=$PM2_NAME"
            echo "APP_PORT=$APP_PORT"
            test -f "$ENV_FILE"

            mkdir -p "$BACKUP_DIR"
            set -a
            . "$ENV_FILE"
            set +a
            test -n "${DATABASE_URL:-}"
            BACKUP_FILE="$BACKUP_DIR/predeploy-${RELEASE_TAG}-$(date -u '+%Y%m%dT%H%M%SZ').sql"
            echo "Creating pre-deploy database backup"
            pg_dump "$DATABASE_URL" > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"
            gzip -f "$BACKUP_FILE"
            echo "Database backup created: ${BACKUP_FILE}.gz"

            cd "$APP_PATH"
            git fetch origin --tags
            git checkout --force "$RELEASE_TAG"
            NEW_COMMIT=$(git rev-parse HEAD)
            BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            EXPECTED_TAG="v$PACKAGE_VERSION"

            if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ] && [ "$RELEASE_TAG" != "$PACKAGE_VERSION" ]; then
              echo "ERROR: version mismatch. package.json version=$PACKAGE_VERSION release_tag=$RELEASE_TAG expected_tag=$EXPECTED_TAG" >&2
              exit 1
            fi

            if ! command -v pnpm >/dev/null 2>&1; then
              npm install -g pnpm@10.33.0
            fi

            pnpm install --frozen-lockfile=false --reporter=append-only
            rm -rf dist/
            pnpm build

            pm2 delete "$PM2_NAME" 2>/dev/null || true
            PORT="$APP_PORT" PAYLINK_COMMIT="$NEW_COMMIT" PAYLINK_BUILD_TIME="$BUILD_TIME" PAYLINK_VERSION="$RELEASE_TAG" APP_VERSION="$PACKAGE_VERSION" pm2 start "$APP_PATH/dist/index.cjs" \
              --name "$PM2_NAME" \
              --cwd "$APP_PATH" \
              --interpreter node \
              --node-args="--require dotenv/config" \
              -- dotenv_config_path="$ENV_FILE"
            pm2 save --force || true

            for i in $(seq 1 30); do
              if curl -fs "http://127.0.0.1:${APP_PORT}/health" >/dev/null 2>&1; then
                echo "Production health passed on ${APP_PORT}"
                exit 0
              fi
              sleep 3
            done
            echo "Production health failed on ${APP_PORT}" >&2
            exit 1
