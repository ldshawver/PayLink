name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            BACKUP_DIR="/home/paylinkssh/backups"

            echo "=== PayLink Deploy Started ==="

            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/paylink_backup_$(date +%Y%m%d_%H%M%S).sql"

            echo "Backing up PostgreSQL database..."
            PGPASSWORD='YOUR_DB_PASSWORD' pg_dump -U apppaylinkmain -h 127.0.0.1 -d apppaylinkmain > "$BACKUP_FILE"
            echo "Backup saved: $BACKUP_FILE"

            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
            git pull origin main

            echo "Installing dependencies..."
            npm install

            echo "Building..."
            npm run build

            echo "Running migrations..."
            PGPASSWORD='YOUR_DB_PASSWORD' psql -h 127.0.0.1 -U apppaylinkmain -d apppaylinkmain -f migrate.sql

            echo "Restarting app..."
            pm2 delete paylink 2>/dev/null || true
            pm2 start "node -r dotenv/config dist/index.cjs" --name paylink
            pm2 save

            echo "Waiting for app to start..."
            sleep 10

            HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/health)
            READY=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ready)

            echo "Health check: $HEALTH"
            echo "Ready check: $READY"

            if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ]; then
              echo "ERROR: Health checks failed"
              pm2 logs paylink --lines 50 --nostream
              exit 1
            fi

            ls -t "$BACKUP_DIR"/paylink_backup_*.sql 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true

            echo "=== Deploy Complete ==="
            echo "Health: $HEALTH | Ready: $READY"
