name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    name: Deploy App (app.mypaylink.app)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            ENV_FILE="/etc/paylink/.env"
            BACKUP_DIR="/home/paylinkssh/backups"

            echo "=========================================="
            echo "PayLink App Deploy - $(date)"
            echo "=========================================="

            # Step 0: Validate env file exists and has required vars
            echo "0. Validating environment..."
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE does not exist. Cannot deploy."
              echo "       Create it manually: sudo mkdir -p /etc/paylink && sudo nano /etc/paylink/.env"
              exit 1
            fi
            for VAR in DATABASE_URL SESSION_SECRET APP_BASE_URL PORT NODE_ENV; do
              if ! grep -q "^${VAR}=" "$ENV_FILE"; then
                echo "ERROR: Required variable $VAR missing from $ENV_FILE"
                exit 1
              fi
            done
            echo "   Environment validated (DATABASE_URL, SESSION_SECRET, APP_BASE_URL, PORT, NODE_ENV)"

            # Step 1: Backup PostgreSQL database
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/paylink_backup_$(date +%Y%m%d_%H%M%S).sql"
            echo "1. Backing up PostgreSQL database..."
            DB_PW=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*://[^:]*:\([^@]*\)@.*|\1|')
            DB_USER=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*://\([^:]*\):.*|\1|')
            DB_NAME=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*/\([^?]*\).*|\1|')
            DB_HOST=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*@\([^:]*\):.*|\1|')
            PGPASSWORD="$DB_PW" pg_dump -U "$DB_USER" -h "$DB_HOST" "$DB_NAME" > "$BACKUP_FILE"
            echo "   Saved: $BACKUP_FILE"

            # Step 2: Fix ownership and pull latest code
            cd "$APP_DIR"
            echo "2. Fixing file ownership and pulling latest code..."
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true

            # Fix any root-owned files FIRST (before git or npm touch anything)
            find "$APP_DIR" -not -path '*/node_modules/*' -not -path '*/.git/*' \
              -user root -exec chown paylinkssh:mypaylink-app {} + 2>/dev/null || true
            chmod -R u+rwX,g+rwX "$APP_DIR" 2>/dev/null || true

            git checkout -- package.json package-lock.json 2>/dev/null || true
            git pull origin main

            # Step 3: Install dependencies
            echo "3. Installing dependencies..."
            npm install --production=false

            # Step 4: Build
            echo "4. Building..."
            rm -rf "$APP_DIR/dist" 2>/dev/null || true
            mkdir -p "$APP_DIR/dist"
            npm run build

            # Step 5: Copy session table SQL
            echo "5. Copying session table SQL..."
            cp node_modules/connect-pg-simple/table.sql dist/

            # Step 6: Restart app with explicit env file path (non-root PM2)
            echo "6. Restarting app..."
            pm2 delete paylink 2>/dev/null || true
            fuser -k 8000/tcp 2>/dev/null || true
            sleep 3
            cd "$APP_DIR" && pm2 start dist/index.cjs \
              --name paylink \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              -- dotenv_config_path="$ENV_FILE"
            pm2 save --force

            # Step 7: Health check
            echo "7. Waiting for app to start..."
            sleep 10

            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)
            READY=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)

            echo "   Health check: $HEALTH"
            echo "   Ready check: $READY"

            if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ]; then
              echo "ERROR: Health checks failed!"
              pm2 logs paylink --lines 50 --nostream
              exit 1
            fi

            # Cleanup old backups (keep last 10)
            ls -t "$BACKUP_DIR"/paylink_backup_*.sql 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true

            echo "=========================================="
            echo "App Deploy Complete - Health: $HEALTH | Ready: $READY"
            echo "=========================================="

  deploy-website:
    runs-on: ubuntu-latest
    name: Deploy Website (mypaylink.app)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: public-site/public

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.WEBSITE_SSH_USER }}
          key: ${{ secrets.WEBSITE_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e

            WEBSITE_DIR="/home/mypaylink/htdocs/mypaylink.appsite"
            REPO_DIR="/home/paylinkssh/paylink-app/PayLink"

            echo "=========================================="
            echo "PayLink Website Deploy - $(date)"
            echo "=========================================="
            echo "   Site user: mypaylink"
            echo "   SSH user: mypaylinks"
            echo "   Target: $WEBSITE_DIR"

            echo "1. Pulling latest code from app repo..."
            cd "$REPO_DIR" 2>/dev/null || true
            git config --global --add safe.directory "$REPO_DIR" 2>/dev/null || true
            git pull origin main 2>/dev/null || true

            echo "2. Syncing public site files..."
            if [ -d "$REPO_DIR/public-site/public" ]; then
              rsync -av --delete \
                --exclude='.git' \
                --exclude='node_modules' \
                "$REPO_DIR/public-site/public/" "$WEBSITE_DIR/"
            else
              echo "ERROR: Source directory not found at $REPO_DIR/public-site/public"
              exit 1
            fi

            echo "3. Restarting website process..."
            pm2 restart mypaylink 2>/dev/null || echo "   PM2 process 'mypaylink' not found, skipping restart"

            echo "4. Verifying..."
            sleep 3
            WEBSITE_CHECK=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ 2>/dev/null || echo "skip")
            echo "   Website check: $WEBSITE_CHECK"

            echo "=========================================="
            echo "Website Deploy Complete"
            echo "=========================================="
