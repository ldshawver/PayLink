name: Deploy PayLink to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-paylink-production
  cancel-in-progress: true

jobs:
  deploy_app:
    name: Deploy Core App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy core app over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_USER="${{ secrets.VPS_USER }}"
            APP_GROUP="mypaylink-app"
            APP_NAME="paylink"
            APP_DIR="/home/${{ secrets.VPS_USER }}/paylink-app/PayLink"
            APP_ENTRY="$APP_DIR/dist/index.cjs"
            APP_PORT="8000"
            ENV_FILE="/etc/paylink/.env"

            echo "========== CORE APP DEPLOY START =========="
            echo "User: $(whoami)"
            echo "App dir: $APP_DIR"

            cd "$APP_DIR"

            echo "==> Sync latest code from GitHub"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Fix ownership before build"
            sudo /usr/bin/chown -R "$APP_USER:$APP_GROUP" "$APP_DIR"

            echo "==> Versions"
            node -v
            npm -v
            pm2 -v

            echo "==> Install dependencies"
            npm install

            echo "==> Build app"
            npm run build

            echo "==> Fix ownership after build"
            sudo /usr/bin/chown -R "$APP_USER:$APP_GROUP" "$APP_DIR"

            echo "==> Verify required files"
            test -f "$APP_ENTRY" || { echo "ERROR: Missing build artifact: $APP_ENTRY"; exit 1; }
            test -f "$ENV_FILE"  || { echo "ERROR: Missing env file: $ENV_FILE"; exit 1; }

            echo "==> Stop old PM2 app if present"
            pm2 delete "$APP_NAME" 2>/dev/null || true

            echo "==> Kill anything lingering on port $APP_PORT"
            sudo fuser -k "${APP_PORT}/tcp" 2>/dev/null || true
            sleep 2

            echo "==> Start app with PM2"
            pm2 start "$APP_ENTRY" \
              --name "$APP_NAME" \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              --restart-delay 5000 \
              --max-restarts 5 \
              -- dotenv_config_path="$ENV_FILE"

            echo "==> Save PM2 process list"
            pm2 save --force

            echo "==> Wait for startup"
            sleep 15

            echo "==> PM2 status"
            pm2 list
            pm2 describe "$APP_NAME" || true
            pm2 logs "$APP_NAME" --lines 75 --nostream || true

            echo "==> Port check"
            ss -tlnp | grep ":$APP_PORT" || true

            echo "==> Health checks"
            HEALTH_CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$APP_PORT/health" || true)"
            READY_CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$APP_PORT/ready" || true)"
            echo "Health: $HEALTH_CODE | Ready: $READY_CODE"

            if [ "$HEALTH_CODE" != "200" ] && [ "$READY_CODE" != "200" ]; then
              echo "ERROR: Core app failed health checks"
              pm2 logs "$APP_NAME" --lines 150 --nostream || true
              exit 1
            fi

            echo "==> Validate nginx"
            sudo /usr/sbin/nginx -t

            echo "==> Reload nginx"
            sudo /usr/bin/systemctl reload nginx

            echo "========== CORE APP DEPLOY SUCCESS =========="

name: Deploy Marketing Site

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy_marketing:
    name: Deploy Marketing Site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy marketing over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -Eeuo pipefail

            SITE_NAME="paylink-site"
            APP_DIR="/home/${{ secrets.VPS_USER }}/paylink-app/PayLink"
            MARKETING_DIR="$APP_DIR/public-site"
            MARKETING_PUBLIC="$MARKETING_DIR/public"
            MARKETING_SERVER="$MARKETING_DIR/server.js"
            WEB_ROOT="/home/mypaylink/htdocs/mypaylink.appsite"

            echo "========== MARKETING DEPLOY START =========="
            echo "User: $(whoami)"
            echo "App dir: $APP_DIR"

            cd "$APP_DIR"

            echo "==> Sync latest code from GitHub"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Diagnostics"
            ls -lah "$MARKETING_DIR" || true
            ls -lah "$MARKETING_PUBLIC" || true
            ls -lah "$WEB_ROOT" || true
            id

            echo "==> Verify paths"
            test -d "$MARKETING_PUBLIC" || { echo "ERROR: Missing marketing public dir: $MARKETING_PUBLIC"; exit 1; }
            test -d "$WEB_ROOT" || { echo "ERROR: Missing or inaccessible web root: $WEB_ROOT"; exit 1; }

            echo "==> Sync static marketing files"
            rsync -av --delete "$MARKETING_PUBLIC/" "$WEB_ROOT/"
            echo "Marketing files synced to $WEB_ROOT"

            echo "==> Start/restart marketing site PM2 process"
            if [ -f "$MARKETING_SERVER" ]; then
              pm2 describe "$SITE_NAME" >/dev/null 2>&1 \
                && pm2 restart "$SITE_NAME" \
                || pm2 start "$MARKETING_SERVER" \
                    --name "$SITE_NAME" \
                    --cwd "$MARKETING_DIR"
              pm2 save --force
            else
              echo "ERROR: Missing marketing server file: $MARKETING_SERVER"
              exit 1
            fi

            echo "==> PM2 status"
            pm2 list
            pm2 describe "$SITE_NAME" || true
            pm2 logs "$SITE_NAME" --lines 75 --nostream || true

            echo "========== MARKETING DEPLOY SUCCESS =========="
