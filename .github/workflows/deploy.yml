name: Deploy PayLink to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_USER="paylinkssh"
            APP_GROUP="mypaylink-app"
            APP_NAME="paylink"
            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            APP_ENTRY="$APP_DIR/dist/index.cjs"
            APP_PORT="8000"
            ENV_FILE="$APP_DIR/.env"
            WEB_ROOT="/home/mypaylink/htdocs/mypaylink.app"

            echo "========== DEPLOY START =========="
            echo "User: $(whoami)"
            echo "App dir: $APP_DIR"

            cd "$APP_DIR"

            echo "==> Sync latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Fix ownership before build"
            sudo chown -R "$APP_USER:$APP_GROUP" "$APP_DIR"

            echo "==> Versions"
            node -v
            npm -v
            pm2 -v

            echo "==> Install dependencies"
            npm install

            echo "==> Build app"
            npm run build

            echo "==> Fix ownership after build"
            sudo chown -R "$APP_USER:$APP_GROUP" "$APP_DIR"

            echo "==> Verify required files"
            test -f "$APP_ENTRY" || { echo "ERROR: Missing build artifact: $APP_ENTRY"; exit 1; }
            test -f "$ENV_FILE" || { echo "ERROR: Missing env file: $ENV_FILE"; exit 1; }

            echo "==> Stop old PM2 app if present"
            pm2 delete "$APP_NAME" 2>/dev/null || true

            echo "==> Start app with PM2"
            pm2 start "$APP_ENTRY" \
              --name "$APP_NAME" \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              -- dotenv_config_path="$ENV_FILE"

            echo "==> Save PM2 process list"
            pm2 save --force

            echo "==> Wait for app startup"
            sleep 15

            echo "==> PM2 status"
            pm2 list
            pm2 describe "$APP_NAME" || true
            pm2 logs "$APP_NAME" --lines 50 --nostream || true

            echo "==> Port check"
            ss -tlnp | grep ":$APP_PORT" || true

            echo "==> Health checks"
            HEALTH_CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$APP_PORT/health" || true)"
            READY_CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$APP_PORT/ready" || true)"
            echo "Health: $HEALTH_CODE | Ready: $READY_CODE"

            if [ "$HEALTH_CODE" != "200" ] && [ "$READY_CODE" != "200" ]; then
              echo "ERROR: App failed health checks"
              pm2 logs "$APP_NAME" --lines 100 --nostream || true
              exit 1
            fi

            echo "==> Validate nginx"
            sudo nginx -t

            echo "==> Reload nginx"
            sudo systemctl reload nginx

            echo "==> Sync static files if present"
            if [ -d "$APP_DIR/dist/public" ] && [ -d "$WEB_ROOT" ]; then
              sudo rsync -av --delete "$APP_DIR/dist/public/" "$WEB_ROOT/"
            fi

            echo "========== DEPLOY SUCCESS =========="
