name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    name: Deploy App (app.mypaylink.app)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            ENV_FILE="$APP_DIR/.env"
            BACKUP_DIR="/home/paylinkssh/backups"

            echo "=========================================="
            echo "PayLink App Deploy - $(date)"
            echo "=========================================="

            # Step 0: Validate .env exists and has required vars
            echo "0. Validating environment..."
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE does not exist. Cannot deploy."
              exit 1
            fi
            for VAR in DATABASE_URL SESSION_SECRET; do
              if ! grep -q "^${VAR}=" "$ENV_FILE"; then
                echo "ERROR: Required variable $VAR missing from $ENV_FILE"
                exit 1
              fi
            done
            echo "   .env validated: DATABASE_URL and SESSION_SECRET present"

            # Step 1: Backup PostgreSQL database
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/paylink_backup_$(date +%Y%m%d_%H%M%S).sql"
            echo "1. Backing up PostgreSQL database..."
            DB_PW=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*://[^:]*:\([^@]*\)@.*|\1|')
            DB_USER=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*://\([^:]*\):.*|\1|')
            DB_NAME=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*/\([^?]*\).*|\1|')
            DB_HOST=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*@\([^:]*\):.*|\1|')
            PGPASSWORD="$DB_PW" pg_dump -U "$DB_USER" -h "$DB_HOST" "$DB_NAME" > "$BACKUP_FILE"
            echo "   Saved: $BACKUP_FILE"

            # Step 2: Pull latest code
            cd "$APP_DIR"
            echo "2. Pulling latest code..."
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
            git checkout -- package.json package-lock.json 2>/dev/null || true
            git stash --include-untracked 2>/dev/null || true
            git pull origin main
            git stash drop 2>/dev/null || true

            # Step 3: Install dependencies
            echo "3. Installing dependencies..."
            npm install --production=false

            # Step 4: Build (no sudo - deploy user owns the files)
            echo "4. Building..."
            if [ -d dist ]; then chmod -R u+w dist/ 2>/dev/null || true; fi
            npm run build

            # Step 5: Copy session table SQL
            echo "5. Copying session table SQL..."
            cp node_modules/connect-pg-simple/table.sql dist/

            # Step 6: Restart app with explicit env file path
            echo "6. Restarting app..."
            pm2 delete paylink 2>/dev/null || true
            fuser -k 8000/tcp 2>/dev/null || true
            sleep 3
            cd "$APP_DIR" && pm2 start dist/index.cjs \
              --name paylink \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              -- dotenv_config_path="$ENV_FILE"
            pm2 save --force

            # Step 7: Health check
            echo "7. Waiting for app to start..."
            sleep 10

            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)
            READY=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)

            echo "   Health check: $HEALTH"
            echo "   Ready check: $READY"

            if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ]; then
              echo "ERROR: Health checks failed!"
              pm2 logs paylink --lines 50 --nostream
              exit 1
            fi

            # Cleanup old backups (keep last 10)
            ls -t "$BACKUP_DIR"/paylink_backup_*.sql 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true

            echo "=========================================="
            echo "App Deploy Complete - Health: $HEALTH | Ready: $READY"
            echo "=========================================="

  deploy-website:
    runs-on: ubuntu-latest
    name: Deploy Website (mypaylink.app)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            WEBSITE_DIR="/home/mypaylink/htdocs/mypaylink.app"

            echo "=========================================="
            echo "PayLink Website Deploy - $(date)"
            echo "=========================================="

            cd "$APP_DIR"
            echo "1. Ensuring latest code..."
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
            git checkout -- package.json package-lock.json 2>/dev/null || true
            git pull origin main 2>/dev/null || true

            echo "2. Syncing public site files..."
            rsync -av --delete \
              --exclude='.git' \
              --exclude='node_modules' \
              "$APP_DIR/public-site/public/" "$WEBSITE_DIR/"

            echo "3. Restarting website process..."
            pm2 restart mypaylink 2>/dev/null || true

            echo "4. Verifying..."
            WEBSITE_CHECK=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ 2>/dev/null || echo "skip")
            echo "   Website check: $WEBSITE_CHECK"

            echo "=========================================="
            echo "Website Deploy Complete"
            echo "=========================================="
