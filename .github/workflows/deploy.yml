name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy (optional)"
        required: false
        default: "Manual trigger"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy App + Marketing Site

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 2222
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e

            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            ENV_FILE="/etc/paylink/.env"
            BACKUP_DIR="/home/paylinkssh/backups"
            WEB_SOURCE="$APP_DIR/public-site/public"
            WEB_ROOT="/home/mypaylink/htdocs/mypaylink.appsite"

            echo "=========================================="
            echo "PayLink Deploy - $(date)"
            echo "=========================================="

            # Step 0: Validate env file
            echo "0. Validating environment..."
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE does not exist. Cannot deploy."
              exit 1
            fi
            for VAR in DATABASE_URL SESSION_SECRET APP_BASE_URL PORT NODE_ENV; do
              if ! grep -q "^${VAR}=" "$ENV_FILE"; then
                echo "ERROR: Required variable $VAR missing from $ENV_FILE"
                exit 1
              fi
            done
            echo "   Environment validated"

            # Step 1: Backup PostgreSQL database
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/paylink_backup_$(date +%Y%m%d_%H%M%S).sql"
            echo "1. Backing up PostgreSQL database..."
            DB_PW=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*://[^:]*:\([^@]*\)@.*|\1|')
            DB_USER=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*://\([^:]*\):.*|\1|')
            DB_NAME=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*/\([^?]*\).*|\1|')
            DB_HOST=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*@\([^:]*\):.*|\1|')
            PGPASSWORD="$DB_PW" pg_dump -U "$DB_USER" -h "$DB_HOST" "$DB_NAME" > "$BACKUP_FILE"
            echo "   Saved: $BACKUP_FILE"

            # Step 2: Sync latest code
            cd "$APP_DIR"
            echo "2. Syncing latest code..."
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            # Step 3: Install dependencies
            echo "3. Installing dependencies..."
            npm install --production=false
            chmod +x "$APP_DIR/node_modules/.bin/"* 2>/dev/null || true
            find "$APP_DIR/node_modules" -path "*/bin/*" -type f -exec chmod +x {} + 2>/dev/null || true

            # Step 4: Build
            echo "4. Building..."
            cd "$APP_DIR"
            chmod -R u+rwX "$APP_DIR"
            rm -rf "$APP_DIR/dist"
            mkdir -p "$APP_DIR/dist"
            npm run build

            # Step 5: Copy session table SQL
            echo "5. Copying session table SQL..."
            cp node_modules/connect-pg-simple/table.sql dist/

            # Step 6: Restart app
            echo "6. Restarting app..."
            cd "$APP_DIR"
            pm2 delete paylink 2>/dev/null || true
            fuser -k 8000/tcp 2>/dev/null || true
            pkill -f "dist/index.cjs" 2>/dev/null || true
            sleep 3

            pm2 start dist/index.cjs \
              --name paylink \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              -- dotenv_config_path="$ENV_FILE"
            pm2 save --force

            # Step 7: Health check
            echo "7. Health check..."
            sleep 10
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)
            READY=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)
            echo "   Health: $HEALTH | Ready: $READY"
            if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ]; then
              echo "ERROR: Health checks failed!"
              pm2 logs paylink --lines 50 --nostream
              exit 1
            fi

            # Cleanup old backups (keep last 10)
            ls -t "$BACKUP_DIR"/paylink_backup_*.sql 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true

            # Step 8: Apply Nginx config
            echo "8. Applying Nginx config..."
            NGINX_CONF="$APP_DIR/scripts/nginx-mypaylink.conf"
            NGINX_AVAIL="/etc/nginx/sites-available/mypaylink.app"
            NGINX_ENABLED="/etc/nginx/sites-enabled/mypaylink.app"
            if [ ! -f "$NGINX_CONF" ]; then
              echo "   ERROR: Nginx config not found at $NGINX_CONF"
              exit 1
            fi
            sudo cp "$NGINX_CONF" "$NGINX_AVAIL"
            echo "   Copied config to $NGINX_AVAIL"
            sudo ln -sf "$NGINX_AVAIL" "$NGINX_ENABLED"
            echo "   Symlinked into sites-enabled"
            if ! sudo nginx -t 2>&1; then
              echo "   ERROR: nginx -t failed. Rolling back config."
              exit 1
            fi
            sudo systemctl reload nginx
            echo "   Nginx reloaded successfully"
            # Verify /api/ proxy rule is present in the live config
            if grep -q 'location.*api' "$NGINX_AVAIL"; then
              echo "   OK: /api/ proxy rule confirmed in active config"
            else
              echo "   WARNING: /api/ proxy rule not found in $NGINX_AVAIL"
            fi

            # Step 9: Deploy marketing site
            # Source lives in the repo already cloned on this VPS — no cross-job state needed.
            echo "9. Deploying marketing site..."
            echo "   Source : $WEB_SOURCE"
            echo "   Dest   : $WEB_ROOT"

            if [ ! -d "$WEB_SOURCE" ]; then
              echo "ERROR: $WEB_SOURCE does not exist after git reset."
              exit 1
            fi

            echo "   Source file count: $(find $WEB_SOURCE -type f | wc -l)"

            # Run rsync as mypaylink so it has native write access to its own web root.
            # --no-perms/--no-owner/--no-group: do not attempt to set metadata (avoids
            # mkstemp Permission denied and failed-to-set-times errors).
            sudo -u mypaylink /usr/bin/rsync -rv --delete \
              --omit-dir-times \
              --no-perms \
              --no-owner \
              --no-group \
              --exclude='.git' \
              --exclude='node_modules' \
              "$WEB_SOURCE/" "$WEB_ROOT/"

            echo "   Deployed $(ls $WEB_ROOT | wc -l) items to web root"

            # Spot-checks on live index.html
            if grep -q 'app\.mypaylink\.app' "$WEB_ROOT/index.html" 2>/dev/null; then
              echo "   WARNING: legacy app.mypaylink.app link still in index.html"
            else
              echo "   OK: no legacy subdomain links in index.html"
            fi
            if grep -q 'href="/clock"' "$WEB_ROOT/index.html" 2>/dev/null; then
              echo "   WARNING: legacy /clock link still in index.html"
            else
              echo "   OK: no legacy /clock links in index.html"
            fi

            echo "=========================================="
            echo "Deploy Complete - App: $HEALTH/$READY | Site: deployed"
            echo "=========================================="
