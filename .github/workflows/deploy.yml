name: Deploy PayLink to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            APP_USER="paylinkssh"
            APP_GROUP="mypaylink-app"
            APP_NAME="paylink"
            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            APP_ENTRY="$APP_DIR/dist/index.cjs"
            APP_PORT="8000"
            ENV_FILE="/etc/paylink/.env"
            WEB_ROOT="/home/mypaylink/htdocs/mypaylink.appsite"

            echo "========== DEPLOY START =========="
            echo "User: $(whoami)"
            echo "App dir: $APP_DIR"

            cd "$APP_DIR"

            echo "==> Sync latest code from GitHub"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Fix ownership before build"
            sudo /usr/bin/chown -R "$APP_USER:$APP_GROUP" "$APP_DIR"

            echo "==> Versions"
            node -v
            npm -v
            pm2 -v

            echo "==> Install dependencies"
            npm install

            echo "==> Build app"
            npm run build

            echo "==> Fix ownership after build"
            sudo /usr/bin/chown -R "$APP_USER:$APP_GROUP" "$APP_DIR"

            echo "==> Verify required files"
            test -f "$APP_ENTRY" || { echo "ERROR: Missing build artifact: $APP_ENTRY"; exit 1; }
            test -f "$ENV_FILE"  || { echo "ERROR: Missing env file: $ENV_FILE"; exit 1; }

            echo "==> Stop old PM2 app if present"
            pm2 delete "$APP_NAME" 2>/dev/null || true

            echo "==> Kill anything lingering on port $APP_PORT"
            sudo fuser -k "${APP_PORT}/tcp" 2>/dev/null || true
            sleep 2

            echo "==> Start app with PM2"
            pm2 start "$APP_ENTRY" \
              --name "$APP_NAME" \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              --restart-delay 5000 \
              --max-restarts 5 \
              -- dotenv_config_path="$ENV_FILE"

            echo "==> Save PM2 process list"
            pm2 save --force

            echo "==> Wait for startup"
            sleep 15

            echo "==> PM2 status"
            pm2 list
            pm2 describe "$APP_NAME" || true
            pm2 logs "$APP_NAME" --lines 50 --nostream || true

            echo "==> Port check"
            ss -tlnp | grep ":$APP_PORT" || true

            echo "==> Health checks (primary success condition)"
            HEALTH_CODE="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$APP_PORT/health" || true)"
            READY_CODE="$(curl -s -o /dev/null -w '%{http_code}'  "http://127.0.0.1:$APP_PORT/ready"  || true)"
            echo "Health: $HEALTH_CODE | Ready: $READY_CODE"

            if [ "$HEALTH_CODE" != "200" ] && [ "$READY_CODE" != "200" ]; then
              echo "ERROR: App failed health checks — aborting"
              pm2 logs "$APP_NAME" --lines 100 --nostream || true
              exit 1
            fi

            echo "==> App is healthy — continuing with optional steps"

            echo "==> Validate nginx"
            sudo /usr/sbin/nginx -t

            echo "==> Reload nginx"
            sudo /usr/bin/systemctl reload nginx

            echo "==> Sync marketing site static files to web root"
            echo "Diagnostics:"
            ls -lah "$APP_DIR/public-site"        || true
            ls -lah "$APP_DIR/public-site/public"  || true
            ls -lah "$WEB_ROOT"                    || true
            id

            if [ -d "$APP_DIR/public-site/public" ] && [ -d "$WEB_ROOT" ]; then
              echo "Syncing marketing files..."
              if sudo /usr/bin/rsync -av --delete "$APP_DIR/public-site/public/" "$WEB_ROOT/"; then
                echo "Marketing files synced to $WEB_ROOT"
              else
                echo "WARN: rsync to $WEB_ROOT failed; continuing because app is healthy"
              fi
            else
              echo "WARN: Marketing public dir or WEB_ROOT not found - skipping rsync"
            fi

            echo "==> Start/restart marketing site server (port 3000)"
            pm2 describe paylink-site &>/dev/null \
              && pm2 restart paylink-site \
              || pm2 start "$APP_DIR/public-site/server.js" \
                   --name paylink-site \
                   --cwd "$APP_DIR/public-site"
            pm2 save --force

            echo "========== DEPLOY SUCCESS =========="
