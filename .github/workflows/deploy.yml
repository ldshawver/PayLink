name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy (optional)"
        required: false
        default: "Manual trigger"

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    name: Deploy App (mypaylink.app)

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            APP_DIR="/home/paylinkssh/paylink-app/PayLink"
            ENV_FILE="/etc/paylink/.env"
            BACKUP_DIR="/home/paylinkssh/backups"

            echo "=========================================="
            echo "PayLink App Deploy - $(date)"
            echo "=========================================="

            # Step 0: Validate env file exists and has required vars
            echo "0. Validating environment..."
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE does not exist. Cannot deploy."
              exit 1
            fi
            for VAR in DATABASE_URL SESSION_SECRET APP_BASE_URL PORT NODE_ENV; do
              if ! grep -q "^${VAR}=" "$ENV_FILE"; then
                echo "ERROR: Required variable $VAR missing from $ENV_FILE"
                exit 1
              fi
            done
            echo "   Environment validated"

            # Step 1: Backup PostgreSQL database
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/paylink_backup_$(date +%Y%m%d_%H%M%S).sql"
            echo "1. Backing up PostgreSQL database..."
            DB_PW=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*://[^:]*:\([^@]*\)@.*|\1|')
            DB_USER=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*://\([^:]*\):.*|\1|')
            DB_NAME=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*/\([^?]*\).*|\1|')
            DB_HOST=$(grep '^DATABASE_URL=' "$ENV_FILE" | sed 's|.*@\([^:]*\):.*|\1|')
            PGPASSWORD="$DB_PW" pg_dump -U "$DB_USER" -h "$DB_HOST" "$DB_NAME" > "$BACKUP_FILE"
            echo "   Saved: $BACKUP_FILE"

            # Step 2: Sync latest code (hard reset to match repo exactly)
            cd "$APP_DIR"
            echo "2. Syncing latest code..."
            git config --global --add safe.directory "$APP_DIR" 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            # Step 3: Install dependencies
            echo "3. Installing dependencies..."
            npm install --production=false
            chmod +x "$APP_DIR/node_modules/.bin/"* 2>/dev/null || true
            find "$APP_DIR/node_modules" -path "*/bin/*" -type f -exec chmod +x {} + 2>/dev/null || true

            # Step 4: Normalize ownership and permissions, then build
            echo "4. Normalizing ownership and building..."
            cd "$APP_DIR"
            chown -R paylinkssh:mypaylink-app "$APP_DIR"
            chmod -R u+rwX "$APP_DIR"
            rm -rf "$APP_DIR/dist"
            mkdir -p "$APP_DIR/dist"
            npm run build

            # Step 5: Copy session table SQL
            echo "5. Copying session table SQL..."
            cp node_modules/connect-pg-simple/table.sql dist/

            # Step 6: Start app as paylinkssh (always clean delete + fresh start)
            echo "6. Starting app as paylinkssh..."
            cd "$APP_DIR"

            # Remove from paylinkssh PM2 list if present
            pm2 delete paylink 2>/dev/null || true

            # Kill any process holding port 8000 (handles root-owned processes too)
            fuser -k 8000/tcp 2>/dev/null || true
            # Fallback: pkill by binary path
            pkill -f "dist/index.cjs" 2>/dev/null || true
            sleep 3

            pm2 start dist/index.cjs \
              --name paylink \
              --cwd "$APP_DIR" \
              --interpreter node \
              --node-args="-r dotenv/config" \
              --update-env \
              -- dotenv_config_path="$ENV_FILE"
            pm2 save --force

            # Step 7: Health check
            echo "7. Waiting for app to start..."
            sleep 10

            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)
            READY=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)

            echo "   Health check: $HEALTH"
            echo "   Ready check: $READY"

            if [ "$HEALTH" != "200" ] || [ "$READY" != "200" ]; then
              echo "ERROR: Health checks failed!"
              pm2 logs paylink --lines 50 --nostream
              exit 1
            fi

            # Cleanup old backups (keep last 10)
            ls -t "$BACKUP_DIR"/paylink_backup_*.sql 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true

            # Step 8: Install/reload Nginx config
            echo "8. Applying Nginx config..."
            NGINX_CONF="$APP_DIR/scripts/nginx-mypaylink.conf"
            NGINX_AVAIL="/etc/nginx/sites-available/mypaylink.app"
            NGINX_ENABLED="/etc/nginx/sites-enabled/mypaylink.app"

            if [ -f "$NGINX_CONF" ]; then
              sudo cp "$NGINX_CONF" "$NGINX_AVAIL"
              sudo ln -sf "$NGINX_AVAIL" "$NGINX_ENABLED" 2>/dev/null || true
              if sudo nginx -t 2>&1; then
                sudo systemctl reload nginx
                echo "   Nginx reloaded successfully"
              else
                echo "   WARNING: nginx -t failed — config not applied. Review $NGINX_CONF"
              fi
            else
              echo "   WARNING: Nginx config file not found at $NGINX_CONF"
            fi

            # Stage public-site files in /tmp for website deploy job
            echo "Staging public-site files for website deploy..."
            rm -rf /tmp/paylink-public-staging
            cp -r "$APP_DIR/public-site/public" /tmp/paylink-public-staging
            chmod -R 755 /tmp/paylink-public-staging

            echo "=========================================="
            echo "App Deploy Complete - Health: $HEALTH | Ready: $READY"
            echo "=========================================="

  deploy-website:
    runs-on: ubuntu-latest
    name: Deploy Marketing Site (mypaylink.app public)
    needs: deploy-app

    steps:
      - name: Setup SSH key for website user
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WEBSITE_SSH_KEY }}" > ~/.ssh/website_key
          chmod 600 ~/.ssh/website_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy marketing site (local rsync on VPS)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.WEBSITE_SSH_USER }}
          key: ${{ secrets.WEBSITE_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            STAGING="/tmp/paylink-public-staging"
            WEB_ROOT="/home/mypaylink/htdocs/mypaylink.appsite"

            echo "=== Marketing Site Deploy ==="

            # Verify staged files exist (populated by deploy-app job)
            if [ ! -d "$STAGING" ]; then
              echo "ERROR: Staging directory $STAGING not found. App deploy may not have run."
              exit 1
            fi

            echo "Staged files found: $(ls $STAGING | wc -l) items"

            # Repair destination ownership and permissions
            chown -R mypaylink:mypaylink "$WEB_ROOT" 2>/dev/null || true
            chmod -R u+rwX "$WEB_ROOT" 2>/dev/null || true

            # Local rsync from staging to web root (no cross-machine permission issues)
            rsync -rltvz --delete \
              --no-times \
              --exclude='.git' \
              --exclude='node_modules' \
              "$STAGING/" "$WEB_ROOT/"

            echo "Deployed files: $(ls $WEB_ROOT | wc -l) items in web root"

            # Spot-check: confirm old links are gone from live index.html
            if grep -q 'app\.mypaylink\.app' "$WEB_ROOT/index.html" 2>/dev/null; then
              echo "WARNING: app.mypaylink.app still found in deployed index.html"
            else
              echo "OK: No legacy app.mypaylink.app links in index.html"
            fi

            if grep -q 'href="/clock"' "$WEB_ROOT/index.html" 2>/dev/null; then
              echo "WARNING: /clock link still found in deployed index.html"
            else
              echo "OK: No legacy /clock links in index.html"
            fi

            # Clean up staging area
            rm -rf "$STAGING"

            echo "=== Marketing Site Deploy Complete ==="
