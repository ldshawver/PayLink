name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required test suite
        run: npm run test:required

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck advisory only
        run: npm run check

  repo-audit:
    name: repo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for merge conflict markers
        run: |
          echo "Scanning for unresolved merge conflict markers..."
          if grep -rEn '^(<<<<<<<|>>>>>>>|=======)$' \
              --include='*.ts' --include='*.tsx' --include='*.js' \
              --include='*.jsx' --include='*.json' --include='*.css' \
              --include='*.html' --include='*.yml' --include='*.yaml' \
              . ; then
            echo "::error::Merge conflict markers found in the repository."
            exit 1
          fi
          echo "No merge conflict markers found."

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json is valid JSON')"

      - name: Ensure no committed .env secrets
        run: |
          echo "Checking that no .env secret files are tracked by git..."
          tracked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Secret .env file(s) committed to the repo:"
            echo "$tracked"
            exit 1
          fi
          echo "No committed .env secret files found."
