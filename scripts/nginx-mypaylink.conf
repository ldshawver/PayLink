# mypaylink.app - Main Nginx configuration
# Serves marketing site (port 3000) by default
# Proxies app/api/login/clock-in paths to Node app (port 8000)
#
# IMPORTANT — CloudPanel deployment notes:
# CloudPanel may override this file with a static-root config.
# The correct deployed config should proxy location / to port 3000 (see bottom).
# If the marketing site is stale, CloudPanel is serving from a web root instead.
#
# To permanently fix the marketing site deploy, SSH into VPS and choose one:
#
# OPTION A — Fix web root write permissions for paylinkssh:
#   sudo usermod -aG mypaylink paylinkssh
#   sudo chmod -R g+w /home/mypaylink/htdocs/mypaylink.appsite
#   sudo find /home/mypaylink/htdocs/mypaylink.appsite -type d -exec chmod g+s {} \;
#   rsync -av /home/paylinkssh/paylink-app/PayLink/public-site/public/ \
#         /home/mypaylink/htdocs/mypaylink.appsite/
#
# OPTION B — Switch nginx to proxy mode (no web root sync needed, recommended):
#   Find the actual CloudPanel nginx config for mypaylink.app. It may be at:
#     /etc/nginx/conf.d/mypaylink.app.conf
#     /etc/nginx/sites-available/mypaylink.app (+ symlink in sites-enabled)
#   Replace location / { root ...; try_files ...; } with:
#     location / { proxy_pass http://127.0.0.1:3000; }
#   Then: sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect for main domain
server {
    listen 80;
    server_name mypaylink.app www.mypaylink.app;
    return 301 https://mypaylink.app$request_uri;
}

# Legacy app subdomain → single-domain redirect
server {
    listen 80;
    listen 443 ssl;
    server_name app.mypaylink.app;

    ssl_certificate     /etc/letsencrypt/live/mypaylink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypaylink.app/privkey.pem;

    return 301 https://mypaylink.app$request_uri;
}

# www redirect
server {
    listen 443 ssl;
    server_name www.mypaylink.app;

    ssl_certificate     /etc/letsencrypt/live/mypaylink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypaylink.app/privkey.pem;

    return 301 https://mypaylink.app$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name mypaylink.app;

    ssl_certificate     /etc/letsencrypt/live/mypaylink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypaylink.app/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Generous upload size for document management
    client_max_body_size 50M;

    # Shared proxy settings (used by all proxy locations)
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # ── App routes → Node app (port 8000) ──────────────────────────────

    location = /login {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /clock-in {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /portal/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /pay/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /payments/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /stripe/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /webhooks/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /demo/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /signing-complete {
        proxy_pass http://127.0.0.1:8000;
    }

    # ── Everything else → Marketing site (port 3000) ───────────────────

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
