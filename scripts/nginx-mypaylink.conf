# mypaylink.app - Main Nginx configuration
# Serves marketing site (port 3000) by default
# Proxies app/api/login/clock-in paths to Node app (port 8000)

# HTTP → HTTPS redirect for main domain
server {
    listen 80;
    server_name mypaylink.app www.mypaylink.app;
    return 301 https://mypaylink.app$request_uri;
}

# Legacy app subdomain → single-domain redirect
server {
    listen 80;
    listen 443 ssl;
    server_name app.mypaylink.app;

    ssl_certificate     /etc/letsencrypt/live/mypaylink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypaylink.app/privkey.pem;

    return 301 https://mypaylink.app$request_uri;
}

# www redirect
server {
    listen 443 ssl;
    server_name www.mypaylink.app;

    ssl_certificate     /etc/letsencrypt/live/mypaylink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypaylink.app/privkey.pem;

    return 301 https://mypaylink.app$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name mypaylink.app;

    ssl_certificate     /etc/letsencrypt/live/mypaylink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypaylink.app/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Generous upload size for document management
    client_max_body_size 50M;

    # Shared proxy settings (used by all proxy locations)
    proxy_http_version  1.1;
    proxy_set_header    Upgrade $http_upgrade;
    proxy_set_header    Connection "upgrade";
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # ── App routes → Node app (port 8000) ──────────────────────────────

    location = /login {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /clock-in {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /app/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /portal/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /pay/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /payments/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /stripe/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /webhooks/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /demo/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /signing-complete {
        proxy_pass http://127.0.0.1:8000;
    }

    # ── Everything else → Marketing site (port 3000) ───────────────────

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
