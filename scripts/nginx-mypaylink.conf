# mypaylink.app / app.mypaylink.app - Nginx reverse-proxy configuration
# ALL traffic is proxied to the PayLink Node app on port 8000.
# No static web-root serving. No marketing-site fallback.
#
# Deploy: sudo cp scripts/nginx-mypaylink.conf /etc/nginx/sites-enabled/mypaylink.app.conf
#         sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name mypaylink.app www.mypaylink.app app.mypaylink.app;
    return 301 https://$host$request_uri;
}

# ── www → apex redirect ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.mypaylink.app;

    ssl_certificate     /etc/letsencrypt/live/mypaylink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypaylink.app/privkey.pem;

    return 301 https://mypaylink.app$request_uri;
}

# ── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name mypaylink.app app.mypaylink.app;

    ssl_certificate     /etc/letsencrypt/live/mypaylink.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mypaylink.app/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         strict-origin-when-cross-origin;

    # Upload size for document management
    client_max_body_size 50M;

    # Shared proxy settings
    proxy_http_version  1.1;
    proxy_set_header    Upgrade            $http_upgrade;
    proxy_set_header    Connection         "upgrade";
    proxy_set_header    Host               $host;
    proxy_set_header    X-Real-IP          $remote_addr;
    proxy_set_header    X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto  $scheme;
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # ── Everything → PayLink Node app (port 8000) ────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
